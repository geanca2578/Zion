<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish Tour Brochure</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
  }

  .brochure {
    width: 210mm;  /* A5 vertical ancho */
    height: 148mm; /* A5 vertical alto */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
    border: 1px solid #ccc; /* Opcional para ver límites */
  }

  .tour-img {
    width: 100%;
    height: 120mm;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  .tour-title {
    font-size: 24px;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
    color: #a00000;
  }

  .qr-box {
    margin-top: 10px;
    text-align: center;
  }

  .qr-text {
    font-weight: bold;
    margin-bottom: 5px;
    color: #000;
  }

  .qr-img {
    width: 100px;
    height: 100px;
  }

</style>
</head>
<body>

<div class="brochure">
  <!-- Imagen del tour -->
  <img src="assets/pics/fishing.jpg" alt="Fish Tour" class="tour-img">

  <!-- Título del tour -->
  <div class="tour-title">Fishing Tour</div>

  <!-- QR Code -->
  <div class="qr-box">
    <div class="qr-text">Scan & Book</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://samatours.netlify.app/" alt="QR Code" class="qr-img">
  </div>
</div>

</body>
</html>
